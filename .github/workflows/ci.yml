name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: altair-plugin-workspace-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out browser workspace plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: altair-plugin-workspace-browser
          persist-credentials: false

      - name: Check out Altair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair
          path: altair-plugin-workspace-browser/.dependencies/altair
          persist-credentials: false

      - name: Check out Vega
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega
          path: altair-plugin-workspace-browser/.dependencies/vega
          persist-credentials: false

      - name: Check out portable Vega UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-ui-portable
          path: altair-plugin-workspace-browser/.dependencies/vega-ui-portable
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext
          path: altair-plugin-workspace-browser/.dependencies/vega-plugin-richtext
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: altair-plugin-workspace-browser/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: altair-plugin-workspace-browser
        run: pnpm install --no-frozen-lockfile

      - name: Build Vega protocol
        working-directory: altair-plugin-workspace-browser
        run: pnpm --filter @haneoka/vega-protocol build

      - name: Build Altair
        working-directory: altair-plugin-workspace-browser
        run: pnpm --filter @haneoka/altair build:core

      - name: Check package
        working-directory: altair-plugin-workspace-browser
        run: pnpm check

      - name: Inspect npm payload
        working-directory: altair-plugin-workspace-browser
        run: pnpm pack --dry-run
