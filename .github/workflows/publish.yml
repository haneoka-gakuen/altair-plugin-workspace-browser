name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: altair-plugin-workspace-browser-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out browser workspace plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: altair-plugin-workspace-browser
          persist-credentials: false

      - name: Check out Altair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair
          path: altair-plugin-workspace-browser/.dependencies/altair
          persist-credentials: false
          ref: cd4e44d0670df22fe2e8f8ae3ebab3ab8365766d

      - name: Check out Vega
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega
          path: altair-plugin-workspace-browser/.dependencies/vega
          persist-credentials: false
          ref: 2fa1b39c1176852db38a45b453c737e8e3439f5d

      - name: Check out portable Vega UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-ui-portable
          path: altair-plugin-workspace-browser/.dependencies/vega-ui-portable
          persist-credentials: false
          ref: 06af193c1c7c7939394469aec5e7cfa7e71b220d

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext
          path: altair-plugin-workspace-browser/.dependencies/vega-plugin-richtext
          persist-credentials: false
          ref: c043823cbb2c63a6966343db2e9ef0fb8ba4b703
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        working-directory: altair-plugin-workspace-browser
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-tag.mjs

      - name: Install dependencies
        working-directory: altair-plugin-workspace-browser
        run: pnpm install --no-frozen-lockfile

      - name: Build Vega protocol
        working-directory: altair-plugin-workspace-browser
        run: pnpm --filter @haneoka/vega-protocol build

      - name: Build Altair
        working-directory: altair-plugin-workspace-browser
        run: pnpm --filter @haneoka/altair build:core

      - name: Check package
        working-directory: altair-plugin-workspace-browser
        run: pnpm check

      - name: Publish package
        working-directory: altair-plugin-workspace-browser
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name=$(node -p "require('./package.json').name.replaceAll('/', '-')")
          package_dir="$RUNNER_TEMP/$package_name"
          mkdir -p "$package_dir"
          pnpm pack --pack-destination "$package_dir"
          npm publish "$package_dir"/*.tgz --access public --provenance
